<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cesar Morales (SoyRiper) — Full Stack & Systems Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            },
            colors: {
              page: '#07090e',
              card: '#0d111a',
              cardHover: '#131926',
              border: '#1f293d',
              subtle: '#94a3b8',
              primary: '#f8fafc',
              neonCyan: '#06b6d4',
              neonEmerald: '#10b981',
              neonPurple: '#a855f7',
            },
            animation: {
              'pulse-glow': 'pulseGlow 3s infinite alternate',
              'scanline': 'scanline 8s linear infinite',
              'float': 'float 4s ease-in-out infinite',
            },
            keyframes: {
              pulseGlow: {
                '0%': { boxShadow: '0 0 15px rgba(6, 182, 212, 0.2)' },
                '100%': { boxShadow: '0 0 35px rgba(16, 185, 129, 0.4)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-8px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #07090e;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      
      ::selection {
        background: #06b6d4;
        color: #000000;
      }

      /* Custom Cyber Grid Background */
      .bg-cyber-grid {
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.12) 0%, transparent 60%),
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
      }

      /* Glassmorphism */
      .glass-card {
        background: rgba(13, 17, 26, 0.75);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .glass-card:hover {
        border-color: rgba(6, 182, 212, 0.4);
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #07090e;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #06b6d4;
      }
    </style>
  </head>
  <body class="bg-cyber-grid">
    <div id="root"></div>
    <script type="module" src="/App.tsx"></script>
  </body>
</html>
