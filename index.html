<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cesar Morales (SoyRiper) — Ingeniero en Informática y Software</title>
    
    <!-- Favicon Links -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/riper_avatar.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              // European Atelier Dark Palette
              page: '#131416',       // Dominante (60%): Gris Piedra Volcánica
              surface: '#1E2024',    // Estructural Contenedores (30%): Grafito Mate
              borderLine: '#2A2C31', // Estructural Bordes: 1px Fine Line
              textMain: '#E5E5E0',   // Estructural Texto Principal: Blanco Hueso Apagado
              textMuted: '#8A8E95',  // Estructural Texto Secundario: Gris Secundario
              accent: '#C5A880',     // Acento (10%): Champagne Satinado / Dorado Satinado
              accentHover: '#D8BC95',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #131416;
        color: #E5E5E0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow-x: hidden;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #131416;
      }
      ::-webkit-scrollbar-thumb {
        background: #2A2C31;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C5A880;
      }

      /* STRICT PRINT STYLES FOR CLEAN PDF GENERATION */
      @media print {
        @page {
          margin: 12mm 15mm;
          size: A4 portrait;
        }
        body {
          background-color: #ffffff !important;
          color: #000000 !important;
          font-family: Arial, Helvetica, sans-serif !important;
        }
        .print\:hidden, header, footer, button, nav, input, form, .sticky, [role="dialog"], .backdrop-blur-md {
          display: none !important;
        }
        .print-only-sheet {
          display: block !important;
          visibility: visible !important;
          background: #ffffff !important;
          color: #000000 !important;
          width: 100% !important;
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#131416] text-[#E5E5E0] selection:bg-[#C5A880] selection:text-[#131416]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
