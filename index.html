<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cesar Morales (SoyRiper) — Full-Stack & Systems Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              // European Atelier Dark Palette
              page: '#131416',       // Dominante (60%): Gris Piedra Volcánica
              surface: '#1E2024',    // Estructural Contenedores (30%): Grafito Mate
              borderLine: '#2A2C31', // Estructural Bordes: 1px Fine Line
              textMain: '#E5E5E0',   // Estructural Texto Principal: Blanco Hueso Apagado
              textMuted: '#8A8E95',  // Estructural Texto Secundario: Gris Secundario
              accent: '#C5A880',     // Acento (10%): Champagne Satinado / Dorado Satinado
              accentHover: '#D8BC95',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #131416;
        color: #E5E5E0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow-x: hidden;
      }
      
      ::selection {
        background: #C5A880;
        color: #131416;
      }

      /* Custom 1px Border Utility */
      .border-atelier {
        border: 1px solid #2A2C31;
      }

      .border-atelier-accent {
        border: 1px solid rgba(197, 168, 128, 0.4);
      }

      /* Subtle Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #131416;
      }
      ::-webkit-scrollbar-thumb {
        background: #2A2C31;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C5A880;
      }
    </style>
  </head>
  <body class="bg-[#131416]">
    <div id="root"></div>
    <script type="module" src="/App.tsx"></script>
  </body>
</html>
